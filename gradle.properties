# -----------------------------------------------------------------------------
# Tiny Ledger — Gradle build configuration
# -----------------------------------------------------------------------------

# Reuse task outputs across builds and across CI runs. The GitHub Actions cache is
# restored by gradle/actions/setup-gradle, so an unchanged module is not recompiled
# on every pull request.
org.gradle.caching=true

# Skip the configuration phase entirely when nothing that feeds it has changed.
# Verified against every task this project actually runs, including quarkusBuild,
# the Jib image builds and gatlingRun.
org.gradle.configuration-cache=true

# org.gradle.parallel is deliberately NOT enabled.
#
# It was tried and measured: 16s either way. There are two subprojects and `load-tests`
# does almost no work, so the critical path is the `:app` test tiers regardless, and
# Gradle parallelises across projects rather than within one.
#
# Against that nil gain sits a real hazard. Parallel execution lets bddTest,
# integrationTest and concurrencyTest overlap, and each one boots Quarkus against the
# same app/build directory. That is how the OpenAPI schema write in
# app/src/main/resources/application.properties was found to race
# (FileAlreadyExistsException, intermittently). That particular race is now fixed, but
# the shared-build-directory hazard is structural, and an intermittent build failure
# costs far more than a second that does not exist.

# A fixed heap keeps the daemon off the JVM's default ergonomics, which vary with the
# machine and make "works on my laptop, fails on the runner" possible.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
