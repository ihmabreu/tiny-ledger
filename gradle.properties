# -----------------------------------------------------------------------------
# Tiny Ledger — Gradle build configuration
# -----------------------------------------------------------------------------

# Reuse task outputs across builds and across CI runs. The GitHub Actions cache is
# restored by gradle/actions/setup-gradle, so an unchanged module is not recompiled
# on every pull request.
org.gradle.caching=true

# Skip the configuration phase entirely when nothing that feeds it has changed.
# Verified against every task this project actually runs, including quarkusBuild,
# the Jib image builds and gatlingRun.
#
# This setting is also what makes the test tiers overlap. Under the configuration
# cache Gradle runs independent tasks *of the same project* concurrently, which is
# the only parallelism this build can benefit from, since `:app` holds all the work.
# It is worth roughly half the wall clock of the full suite - see the table below.
org.gradle.configuration-cache=true

# org.gradle.parallel is deliberately NOT enabled, and enabling it would change nothing.
#
# `org.gradle.parallel` parallelises across *projects*. There are two here, and
# `load-tests` does almost no work, so the critical path is the `:app` test tiers
# either way. Under the configuration cache the flag is ignored outright: Gradle
# schedules tasks against the worker pool regardless of it. Re-measured on
# `./gradlew clean :app:check --no-build-cache`, alternating the runs:
#
#   configuration cache   parallel   wall clock
#   on                    off        17.5s
#   on                    on         17.8s
#   off                   off        31.2s
#   off                   on         32.4s
#
# So the lever that matters is the configuration cache above, not this flag. If a
# local run of the suite takes ~32s rather than ~18s, the configuration cache is not
# in effect (an IDE-delegated run, or --no-configuration-cache) - that, not this
# setting, is the thing to fix.
#
# One consequence is worth spelling out, because it is easy to read the "off" above as
# "the tiers do not overlap": they do overlap, today. bddTest, integrationTest and
# concurrencyTest boot Quarkus concurrently against the same app/build directory. That
# is how the OpenAPI schema write was found to race (FileAlreadyExistsException,
# intermittently); it is fixed by disabling store-schema-directory under the %test
# profile in app/src/main/resources/application.yml, not by this flag. Anything else a
# tier writes into app/build has to be collision-free for the same reason.
#
# To serialise the tiers, cap the worker pool (org.gradle.workers.max=1) or give them
# explicit mustRunAfter ordering. Turning org.gradle.parallel off does not do it.

# A fixed heap keeps the daemon off the JVM's default ergonomics, which vary with the
# machine and make "works on my laptop, fails on the runner" possible.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
