name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (${{ matrix.tier.name }})
    runs-on: ubuntu-latest
    strategy:
      # Every tier is reported independently, so a failure names the kind of
      # problem straight away instead of hiding inside one opaque "build failed".
      fail-fast: false
      matrix:
        tier:
          - { name: unit,        task: ':app:test' }
          - { name: integration, task: ':app:integrationTest' }
          - { name: bdd,         task: ':app:bddTest' }
          - { name: e2e,         task: ':app:e2eTest' }
          - { name: concurrency, task: ':app:concurrencyTest' }

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run the ${{ matrix.tier.name }} tier
        run: ./gradlew ${{ matrix.tier.task }} --stacktrace

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.tier.name }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # Each tier writes its own JaCoCo execution data (build/jacoco/<task>.exec).
      # Handing it to the coverage job means the report covers all five tiers
      # without any suite being executed twice.
      - name: Publish the coverage execution data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.tier.name }}
          path: app/build/jacoco/*.exec
          if-no-files-found: ignore
          retention-days: 1

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: verify
    # Runs even when a tier fails: a partial coverage report is still the quickest
    # way to see what the failing change did or did not exercise. The pull request
    # is already red from `verify`, so this job must not be the one to hide that.
    if: ${{ !cancelled() }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Every tier drops its .exec into the one directory JaCoCo reads from. The
      # file names are the task names, so they never collide.
      #
      # continue-on-error, narrowly: the action errors when *no* artifact matches,
      # which only happens when every tier died before producing execution data
      # (a compile error, say). `verify` already reports that loudly, and turning
      # this job red as well would add noise, not information. The report step
      # below then simply has nothing to do.
      - name: Collect the execution data from every tier
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: app/build/jacoco

      - name: List the collected execution data
        run: ls -l app/build/jacoco || echo "no execution data was produced"

      - name: Generate the JaCoCo report
        run: ./gradlew :app:jacocoTestReport --stacktrace

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      # The threshold check runs *after* the report has been generated and uploaded,
      # and the upload above is `if: always()`. So when coverage falls below the bar
      # this job goes red while the HTML report is already attached to the run - the
      # one artifact you actually need to see which lines and branches were missed.
      #
      # Gated on a green `verify`, because a failed tier means its .exec never
      # arrived: the bundle would then be measured with a whole suite missing and
      # fail on the *absence of data* rather than on a real coverage regression.
      # That is a misleading reason to fail, on top of a build that is already red.
      - name: Verify the coverage thresholds
        if: ${{ needs.verify.result == 'success' }}
        run: ./gradlew :app:jacocoTestCoverageVerification --stacktrace

  javadoc:
    name: Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Documentation that does not build is documentation nobody reads, so the
      # Javadoc is compiled on every change rather than on release only.
      - name: Build the Javadoc
        run: ./gradlew :app:javadoc

      # Published as well as compiled: reviewers get a browsable copy of the API
      # documentation for the exact commit, without having to build it locally.
      - name: Publish the Javadoc
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: javadoc
          path: app/build/docs/javadoc/
          if-no-files-found: ignore
          retention-days: 7

  load-tests:
    name: Load tests (compile only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The simulations are compiled but not executed: latency numbers taken on a
      # shared CI runner would be noise, and failing a pull request on that noise
      # would teach everyone to ignore the job. They are run deliberately, against
      # a known environment — see docs/TESTING.md.
      - name: Compile the Gatling simulations
        run: ./gradlew :load-tests:gatlingClasses

  container-image:
    name: Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both target architectures are built and, more importantly, actually
        # started and called. A build that succeeds and an image that boots are
        # different claims, and only the second one matters.
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: aarch64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Jib needs no emulation to *build* for another architecture - it assembles
      # layers rather than executing them. QEMU is registered so the runner can
      # *run* the foreign image in the smoke test below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.platform }}

      # --no-build-cache: Jib loads the image into the Docker daemon as a side effect
      # Gradle does not track. A cache hit on the Quarkus build (e.g. on a re-run)
      # would skip Jib entirely and leave no image behind, while reporting success.
      - name: Build the ${{ matrix.platform }} image
        run: |
          ./gradlew :app:build --no-build-cache \
            -x test -x bddTest -x integrationTest -x concurrencyTest -x e2eTest \
            -Dquarkus.container-image.build=true \
            -Dquarkus.jib.platforms=${{ matrix.platform }}

      - name: Verify the image reports the expected architecture
        run: |
          set -euo pipefail
          actual=$(docker image inspect teya/tiny-ledger:1.0.0 --format '{{.Os}}/{{.Architecture}}')
          echo "image platform: $actual"
          test "$actual" = "${{ matrix.platform }}"

      - name: Start the container and call the API
        run: |
          set -euo pipefail
          docker run -d --rm --name tiny-ledger \
            --platform ${{ matrix.platform }} -p 8080:8080 \
            teya/tiny-ledger:1.0.0

          # An emulated JVM starts slowly, so poll rather than sleeping a guess.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/accounts >/dev/null 2>&1; then
              echo "service answered after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "service did not start within 60s" >&2
              docker logs tiny-ledger >&2
              exit 1
            fi
            sleep 1
          done

          echo "container arch: $(docker exec tiny-ledger uname -m)"
          test "$(docker exec tiny-ledger uname -m)" = "${{ matrix.arch }}"

          # Exercise a write path too: a container that only serves a GET has not
          # proven much about the application inside it.
          account=$(curl -fsS -X POST http://localhost:8080/api/v1/accounts \
            -H 'Content-Type: application/json' \
            -d '{"ownerName":"CI","currency":"EUR"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')

          # `Idempotency-Key` and `occurredAt` are both mandatory on a movement, so the
          # smoke test sends them the way a real client would rather than the bare
          # minimum. The key is generated per run; /proc is used instead of uuidgen
          # because it needs no package to be installed on the runner.
          curl -fsS -X POST "http://localhost:8080/api/v1/accounts/$account/transactions" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" \
            -d "{\"type\":\"DEPOSIT\",\"amount\":\"100.00\",\"currency\":\"EUR\",\"occurredAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >/dev/null

          balance=$(curl -fsS "http://localhost:8080/api/v1/accounts/$account/balance" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["availableBalance"])')
          echo "balance after deposit: $balance"
          test "$balance" = "100.00"

      - name: Stop the container
        if: always()
        run: docker rm -f tiny-ledger || true

  multiarch-manifest:
    name: Multi-architecture manifest list
    runs-on: ubuntu-latest
    needs: container-image

    services:
      # A throwaway registry, because a manifest list is the one thing a local
      # Docker daemon cannot hold. Without this the multi-arch path would only
      # ever be exercised by a real release - which is a poor time to find out
      # it is broken.
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # --no-build-cache for the same reason as the image job: the push is a side
      # effect, and a cache hit would skip it.
      - name: Push a combined amd64 + arm64 image
        run: |
          ./gradlew :app:build --no-build-cache \
            -x test -x bddTest -x integrationTest -x concurrencyTest -x e2eTest \
            -Dquarkus.profile=multiarch \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=localhost:5000 \
            -Dquarkus.container-image.insecure=true

      - name: Assert the manifest list covers both architectures
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            http://localhost:5000/v2/teya/tiny-ledger/manifests/1.0.0 > manifest.json

          python3 - <<'EOF'
          import json, sys

          manifest = json.load(open("manifest.json"))
          found = sorted(
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in manifest.get("manifests", [])
          )
          expected = ["linux/amd64", "linux/arm64"]

          print("platforms in the manifest list:", found)
          if found != expected:
              sys.exit(f"expected {expected}, found {found}")
          EOF
